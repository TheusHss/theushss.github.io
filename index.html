<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="src/icon-192.png" />
  <title>allone</title>
</head>

<body>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: black;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    @keyframes tiroPulse {
      0% {
        transform: scale(1.6);
      }

      50% {
        transform: scale(1.8);
      }

      100% {
        transform: scale(1.6);
      }
    }

    #cabine {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scale(1.6);
    }

    #cabine.tiro-animado {
      animation: tiroPulse 0.1s ease;
    }

    .mobile-btn {
      background-color: rgba(0, 100, 200, 0.8);
      border: 2px solid #00ffff;
      color: white;
      font-size: 14px;
      padding: 8px 12px;
      margin: 4px;
      border-radius: 8px;
      font-family: monospace;
      cursor: pointer;
      min-width: 60px;
    }

    .mobile-btn:active {
      background-color: rgba(0, 150, 255, 1);
    }
  </style>
  <canvas id="espaco" style="position: absolute; top: 0; left: 0;"></canvas>
  <audio id="somExplosaoBase" src="./src/explosion-under-snow-sfx-230505.mp3" preload="auto"></audio>
  <audio id="somRespiracao" src="./src/deep-breathing-sound-247414.mp3" preload="auto"></audio>
  <audio id="fundo" src="./src/continuous-bass-rumble-336529.mp3" preload="auto"></audio>
  <audio id="pin" src="./src/pindrop-85096.mp3" preload="auto"></audio>
  <!-- <audio id="music" src="./src/street-phonk-chill-urban-lo-fi-beat-336358.mp3" preload="auto"></audio> -->
  <audio id="tp" src="./src/boom-208750.mp3" preload="auto"></audio>

  <div style="position: absolute; top: 0; left: 0; z-index: 999; pointer-events: none; width: 100vw; height: 100vh;">
    <img id="cabine" src="./src/cabine-2.png" alt="cabine" />
  </div>
  <!-- Controles Mobile -->
  <div id="mobileControls" style="position: absolute; z-index: 999; bottom: 20px; left: 20px; pointer-events: auto;">
    <!-- Movimento -->
    <button onclick="teclas['w'] = true; setTimeout(() => teclas['w'] = false, 200);" class="mobile-btn">▲</button><br>
    <button onclick="teclas['a'] = true; setTimeout(() => teclas['a'] = false, 200);" class="mobile-btn">◄</button>
    <button onclick="teclas['s'] = true; setTimeout(() => teclas['s'] = false, 200);" class="mobile-btn">▼</button>
    <button onclick="teclas['d'] = true; setTimeout(() => teclas['d'] = false, 200);" class="mobile-btn">►</button>
  </div>

  <!-- Ações -->
  <div style="position: absolute; z-index: 999; bottom: 20px; right: 20px; pointer-events: auto;">
    <button onclick="teclas['r'] = true; setTimeout(() => teclas['r'] = false, 200);" class="mobile-btn">+</button><br>
    <button onclick="teclas['n'] = true; setTimeout(() => teclas['n'] = false, 200);" class="mobile-btn">Nomes</button>
  </div>


</body>

<script src="./src/js/app.js"></script>

</html>
